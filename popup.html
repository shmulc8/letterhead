<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff;
    --fg: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --field: #ffffff;
    --hover: #f9fafb;
    --accent: #f59e0b;
    --ink: #1f2937;
    --danger: #b91c1c;
    --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f2937;
      --fg: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --field: #111827;
      --hover: #263244;
      --danger: #fca5a5;
      --ok: #86efac;
    }
  }

  * { box-sizing: border-box; }
  body {
    width: 340px; margin: 0; padding: 12px;
    font: 13px/1.45 system-ui, -apple-system, sans-serif;
    color: var(--fg); background: var(--bg);
  }

  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  header img { width: 22px; height: 22px; border-radius: 5px; }
  header h1 { flex: 1; margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .2px; }

  /* Toggle switch */
  .switch { position: relative; display: inline-block; width: 32px; height: 18px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .track { position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: background .15s; pointer-events: none; }
  .track::before {
    content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .row select { flex: 1; }
  input, select {
    width: 100%; padding: 6px 8px; margin-bottom: 6px;
    font: inherit; color: var(--fg); background: var(--field);
    border: 1px solid var(--border); border-radius: 6px;
  }
  select { margin-bottom: 0; }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(245,158,11,.25); }
  input:disabled { color: var(--muted); background: var(--hover); }
  input::placeholder { color: var(--muted); }

  button {
    font: inherit; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--field); color: var(--fg); cursor: pointer;
  }
  button:hover { background: var(--hover); }
  #add { width: 100%; border: 0; font-weight: 600; color: #1f2937; background: var(--accent); }
  #add:hover { filter: brightness(1.06); }

  #msg { min-height: 16px; margin-top: 6px; font-size: 12px; color: var(--danger); }
  #msg.ok { color: var(--ok); }

  ul { list-style: none; margin: 10px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-top: 1px solid var(--border); border-radius: 4px; }
  li:hover { background: var(--hover); }
  li.empty { display: block; padding: 14px 4px; color: var(--muted); text-align: center; }
  .detail { flex: 1; min-width: 0; }
  .detail code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .detail small { display: block; color: var(--muted); overflow-wrap: anywhere; }
  .tag {
    flex: none; padding: 1px 5px; border-radius: 4px;
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
    color: #fff; background: #64748b;
  }
  .tag.response { background: #0369a1; }
  .del { flex: none; padding: 2px 7px; border: 0; background: none; color: var(--muted); font-size: 15px; line-height: 1; }
  .del:hover { background: none; color: var(--danger); }

  footer { display: flex; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  footer button, .file { flex: 1; text-align: center; }
  .file {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--field); cursor: pointer;
  }
  .file:hover { background: var(--hover); }
</style>

<header>
  <img src="icon48.png" alt="">
  <h1>Letterhead</h1>
  <label class="switch" title="Enable or disable every rule">
    <input type="checkbox" id="enabled"><span class="track"></span>
  </label>
</header>

<div class="row">
  <select id="target">
    <option value="request">Request header</option>
    <option value="response">Response header</option>
  </select>
  <select id="op">
    <option value="set">set</option>
    <option value="append">append</option>
    <option value="remove">remove</option>
  </select>
</div>
<input id="domain" placeholder="Domain">
<input id="name" placeholder="Header name">
<input id="value" placeholder="Header value">
<button id="add">Add rule</button>
<div id="msg"></div>

<ul id="list"></ul>

<footer>
  <button id="export">Export</button>
  <label class="file">Import<input type="file" id="import" accept="application/json" hidden></label>
</footer>

<script src="popup.js"></script>
